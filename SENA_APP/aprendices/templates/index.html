<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SENA - Sistema de Gestión</title>
    <style>
        :root {
            --primary: #0f0c29;
            --secondary: #1a1a2e;
            --accent: #7b2cbf;
            --text: #f8f9fa;
            --highlight: #ff7b00;
        }
        
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background-attachment: fixed;
        }
        
        .glass-container {
            background: rgba(15, 12, 41, 0.85);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 40px;
            width: 80%;
            max-width: 600px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.1);
            text-align: center;
            animation: fadeIn 1s ease-in-out;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        h1 {
            margin-bottom: 20px;
            font-size: 2.5rem;
        }
        
        .sena-highlight {
            color: var(--highlight);
            font-weight: bold;
            text-shadow: 0 0 12px rgba(255, 123, 0, 0.6);
        }
        
        p.subtitle {
            font-size: 1.2rem;
            margin-bottom: 30px;
            opacity: 0.9;
        }
        
        .buttons-container {
            display: flex;
            gap: 20px;
            justify-content: center;
            margin-top: 30px;
        }
        
        .btn {
            padding: 12px 25px;
            border: none;
            border-radius: 50px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-block;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        .btn-primary {
            background-color: var(--accent);
            color: white;
        }
        
        .btn-secondary {
            background-color: transparent;
            color: var(--accent);
            border: 2px solid var(--accent);
        }
        
        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
        }
        
        .btn-primary:hover {
            background-color: #5a189a;
        }
        
        .btn-secondary:hover {
            background-color: rgba(123, 44, 191, 0.15);
        }
        
        @media (max-width: 768px) {
            .glass-container {
                width: 90%;
                padding: 30px 20px;
            }
            
            .buttons-container {
                flex-direction: column;
                gap: 15px;
            }
            
            h1 {
                font-size: 2rem;
            }
        }
        
        footer {
            margin-top: 40px;
            opacity: 0.7;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>
    <div class="glass-container">
        <h1>Bienvenido a <span class="sena-highlight">SENA</span></h1>
        <p class="subtitle">Ingresa para ver los aprendices registrados y gestionar el sistema</p>
        
        <div class="buttons-container">
            <a href="/admin" class="btn btn-primary">Panel de Administración</a>
            <a href="/aprendices/" class="btn btn-secondary">Lista de Aprendices</a>
        </div>
    </div>
    
    <footer>
        Sistema de Gestión de Aprendices © 2023
    </footer>
</body>
</html>
