<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}SENA - Gestión{% endblock %}</title>
    <!-- Bootstrap CSS (Personalizado con verde SENA) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root {
            --sena-green: #2E8B57;
            --dark-purple: #4B0082;
        }
        .bg-sena {
            background-color: var(--sena-green) !important;
        }
        .btn-sena {
            background-color: var(--sena-green);
            border: none;
            color: white;
        }
        .glass-container {
            background: rgba(255, 255, 255, 0.9);
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
        }
    </style>
</head>
<body class="bg-light">
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg bg-sena navbar-dark mb-4">
        <div class="container">
            <a class="navbar-brand" href="/">SENA</a>
        </div>
    </nav>

    <!-- Contenido Dinámico -->
    <div class="container">
        {% block content %}{% endblock %}
    </div>

    <!-- Footer -->
    <footer class="text-center mt-5 py-3 text-muted">
        Sistema de Gestión de Aprendices © 2023
    </footer>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
